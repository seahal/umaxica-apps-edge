name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; pushes to main/develop are not,
  # so every commit on those branches keeps its own verdict and a breakage can
  # be pinned to the commit that caused it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The repository-level gates, in ONE job. Each used to be its own job, and
  # each job spent one to three minutes restoring the pnpm store and installing
  # the workspace to run a check that takes seconds. They now share that setup.
  #
  # Every step still runs when an earlier one fails (`!cancelled()`), so one red
  # gate never masks another, and the failing step's name says which gate it
  # was. Each is one `pnpm run …`, the same command Lefthook and a developer run,
  # so a red step is reproducible by copying one line.
  #
  # None of them has a `--fix` counterpart in CI. `syncpack fix` exists as
  # `pnpm run fix:deps`, and it is a local command on purpose: a workflow that
  # repairs the tree hides the drift it was hired to report.
  static:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: audit
        run: pnpm audit --audit-level=high
      - name: format
        if: ${{ !cancelled() }}
        run: pnpm run format:check
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm run lint
      - name: architecture
        if: ${{ !cancelled() }}
        run: pnpm run check:architecture
      - name: deps
        if: ${{ !cancelled() }}
        run: pnpm run check:deps
      - name: spelling
        if: ${{ !cancelled() }}
        run: pnpm run check:spelling
      # `wrangler types` is regenerated and then re-checked, so a wrangler.jsonc
      # change whose bindings were never regenerated fails here rather than
      # surfacing as a type error nobody can reproduce.
      - name: generated-types
        if: ${{ !cancelled() }}
        run: pnpm run check:generated
      # Needs only Node: `tools/check-workers.mjs` imports `node:` builtins and
      # its own local lib.
      - name: check-workers
        if: ${{ !cancelled() }}
        run: node tools/check-workers.mjs

  # Static analysis of this workflow and .github/actions/: template injection,
  # over-broad permissions, persisted credentials, unpinned `uses:`. Any finding
  # fails the job.
  #
  # zizmor itself, from PyPI through the runner's own pipx — not
  # zizmor-action, which runs zizmor in a Docker container that ubuntu-slim
  # does not have. Pinned so a new audit in a zizmor release arrives as a
  # reviewed bump, not as a red CI on an unrelated change.
  zizmor:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.30.1 --format github .github/

  # GitHub's own review of the dependency changes a pull request introduces:
  # a newly added or upgraded package with a known high/critical advisory fails
  # it, which `pnpm audit` on the whole tree cannot single out. Pull requests
  # only — the action compares the PR's base and head.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # One Knip run per DEPLOYMENT UNIT, not one for the monorepo. The gate answers
  # "would this unit still hold together as its own repository?", so each run is
  # scoped to a single unit's directory and its own knip.jsonc. A monorepo-wide
  # run cannot answer that: a dependency hoisted to the repository root reads as
  # "listed" from the root even when the owning unit never declares it.
  #
  # The job name carries platform and unit (knip:cloudflare:app-core,
  # knip:cloudflare:dev-apex) so a red check names the failing deployment directly.
  # fail-fast is off so one unit's failure does not mask the other twenty.
  #
  # Every unit runs on every push: no path filter. Deliberate — a change to the
  # lockfile, pnpm-workspace.yaml, or the root package.json can flip any unit
  # from PASS to FAIL without touching that unit's own files, and missing that
  # costs more than the CI minutes a filter would save.
  knip:
    name: knip:${{ matrix.platform }}:${{ matrix.unit }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: cloudflare, unit: app-apex, dir: app/apex }
          - { platform: cloudflare, unit: app-core, dir: app/core }
          - { platform: cloudflare, unit: app-docs, dir: app/docs }
          - { platform: cloudflare, unit: app-help, dir: app/help }
          - { platform: cloudflare, unit: app-info, dir: app/info }
          - { platform: cloudflare, unit: app-news, dir: app/news }
          - { platform: cloudflare, unit: com-apex, dir: com/apex }
          - { platform: cloudflare, unit: com-core, dir: com/core }
          - { platform: cloudflare, unit: com-docs, dir: com/docs }
          - { platform: cloudflare, unit: com-help, dir: com/help }
          - { platform: cloudflare, unit: com-info, dir: com/info }
          - { platform: cloudflare, unit: com-news, dir: com/news }
          - { platform: cloudflare, unit: net-apex, dir: net/apex }
          - { platform: cloudflare, unit: org-apex, dir: org/apex }
          - { platform: cloudflare, unit: org-core, dir: org/core }
          - { platform: cloudflare, unit: org-docs, dir: org/docs }
          - { platform: cloudflare, unit: org-help, dir: org/help }
          - { platform: cloudflare, unit: org-info, dir: org/info }
          - { platform: cloudflare, unit: org-news, dir: org/news }
          - { platform: cloudflare, unit: dev-apex, dir: dev/apex }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # No --include filter: the default report already covers unused files,
      # exports, types, dependencies and devDependencies, and restricting it to
      # unlisted/unresolved/binaries was hiding the first three.
      #
      # `run knip`, not `exec knip`: the script carries
      # `--treat-config-hints-as-errors`, and calling the binary directly would
      # have left CI running a weaker check than the one a developer runs.
      - run: pnpm --dir "$UNIT_DIR" run knip
        env:
          UNIT_DIR: ${{ matrix.dir }}
          NODE_OPTIONS: '--max-old-space-size=4096'

  secret-scan:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-types:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm run lint:types

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          # The one job that saves the pnpm store (see .github/actions/setup).
          # Pushes only: a pull_request cache is scoped to its merge ref and
          # would be restorable by nothing else.
          save-cache: ${{ github.event_name == 'push' }}
      - run: pnpm run typecheck

  # One Vitest run per deployment unit, so a red check names the unit, and one
  # for the repository invariants in `test/`, which belong to no unit.
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - app/apex
          - app/core
          - app/docs
          - app/help
          - app/info
          - app/news
          - com/apex
          - com/core
          - com/docs
          - com/help
          - com/info
          - com/news
          - dev/apex
          - net/apex
          - org/apex
          - org/core
          - org/docs
          - org/help
          - org/info
          - org/news
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm -C "$TARGET" run test
        env:
          TARGET: ${{ matrix.target }}

  test-repo:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm run test:repo

  # Shuffled-order run of the same suites, as a separate job so the fast `test`
  # gate above is never slowed by it. Shuffles file and within-file test order
  # (not `test.concurrent` — see evidence/2026-09-07-vitest-hardening.md) to
  # catch order dependence, module-state leakage and global leakage. A failure
  # here is a shared-state defect in a test, not a reason to add a retry.
  test-stress:
    name: test-stress (${{ matrix.target }})
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - app/apex
          - app/core
          - app/docs
          - app/help
          - app/info
          - app/news
          - com/apex
          - com/core
          - com/docs
          - com/help
          - com/info
          - com/news
          - dev/apex
          - net/apex
          - org/apex
          - org/core
          - org/docs
          - org/help
          - org/info
          - org/news
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm -C "$TARGET" run test:stress
        env:
          TARGET: ${{ matrix.target }}

  test-repo-stress:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm run test:repo:stress

  # The browser bundle budget. This job builds, but building is the *means*,
  # not the question: "does it build?" is already answered by Cloudflare, which
  # runs Workers Builds on every push — including non-production branches, where
  # `preview_urls` gives a real deployed URL that proves the Worker starts and
  # responds, not merely that Vite exited zero. Duplicating that here bought a
  # weaker signal twice.
  #
  # What Cloudflare does NOT do is measure the output against
  # `.size-limit.json`, and a bundle cannot be sized without having been built.
  # That is the whole reason this matrix survives. If the size budget is ever
  # dropped, drop this job with it rather than keeping a build for its own sake.
  size:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - app/apex
          - app/core
          - app/docs
          - app/news
          - app/help
          - app/info
          - com/apex
          - com/core
          - com/docs
          - com/news
          - com/help
          - com/info
          - dev/apex
          - net/apex
          - org/apex
          - org/core
          - org/docs
          - org/news
          - org/help
          - org/info
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      # Not a build gate — the input the measurement below needs.
      - run: pnpm -C "$TARGET" run build
        env:
          TARGET: ${{ matrix.target }}
      # `--if-present` is kept as a guard rather than a carve-out: every unit
      # in this matrix now declares `check:size`, including dev/apex, which
      # gained a .size-limit.json when it moved onto Workers and the shared
      # apex archetype. The flag means adding a unit without a budget fails
      # loudly at review rather than silently at the pnpm exit code.
      - run: pnpm -C "$TARGET" run --if-present check:size
        env:
          TARGET: ${{ matrix.target }}

  # The HTTP contract gate. Each unit's `test:api` starts its own server through
  # `api/run.mjs`, runs Hurl against it and stops it again, so this job needs no
  # service container and no shell backgrounding — the same command a developer
  # runs locally.
  #
  # `test:e2e` is deliberately NOT here. Playwright needs a browser binary that
  # neither this workflow nor `Containerfile` installs, so adding the job would
  # mean adding `playwright install --with-deps` to both; it stays a documented
  # local gate until that is a decision someone makes on purpose.
  test-api:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - app/apex
          - app/core
          - app/docs
          - app/news
          - app/help
          - app/info
          - com/apex
          - com/core
          - com/docs
          - com/news
          - com/help
          - com/info
          - dev/apex
          - net/apex
          - org/apex
          - org/core
          - org/docs
          - org/news
          - org/help
          - org/info
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
      - run: pnpm -C "$TARGET" run test:api
        env:
          TARGET: ${{ matrix.target }}
